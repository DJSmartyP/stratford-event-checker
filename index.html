<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f086f">
  <meta name="description" content="PPEC Stratford Crowd Checker: compare Phantom Peak performances with London Stadium events.">
  <title>PPEC Stratford Crowd Checker</title>
  <link rel="icon" type="image/png" href="assets/ppec-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="frame-stage" aria-label="PPEC Stratford Crowd Checker">
    <section class="frame-panel">
      <div class="panel-page">
        <header class="panel-header">
          <div>
            <p class="eyebrow">PPEC STRATFORD</p>
            <h1>Crowd Checker</h1>
          </div>
          <div class="live-note">PP × London Stadium</div>
        </header>

        <section class="week-picker" aria-label="Week navigation">
          <button id="prevWeek" class="nav-button" type="button" aria-label="View previous week">← <span>Previous</span></button>
          <div class="week-heading" aria-live="polite">
            <div id="weekLabel" class="week-kicker">OPENING WEEK</div>
            <h2 id="weekRange">30 NOV – 6 DEC 2026</h2>
            <div id="weekCounter" class="week-counter">Week 1 of 13</div>
          </div>
          <button id="nextWeek" class="nav-button" type="button" aria-label="View next week"><span>Next</span> →</button>
        </section>

        <section id="summary" class="summary-card" aria-live="polite"></section>
        <section id="schedule" class="schedule-list" aria-label="Phantom Peak performances"></section>

        <footer class="panel-footer">
          <span><b class="legend-dot clash"></b> Stadium same day</span>
          <span><b class="legend-dot clear"></b> Clear</span>
          <span id="stadiumChecked" class="checked"></span>
        </footer>
      </div>
    </section>
  </main>

  <script src="schedule-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
